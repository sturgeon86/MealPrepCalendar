name: Build

# Chaque push sur main exécute les tests sur SQL Server 2017, puis publie l'image sur
# ghcr.io/<propriétaire>/mealprepcalendar (étiquettes : latest et sha-<commit>).
# Fixé à Ubuntu 24.04 : SQL Server 2017 n'est pas pris en charge sur les versions plus récentes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Un SQL Server jetable, avec un mot de passe généré pour cette exécution seulement.
      - name: Démarrer SQL Server 2017
        run: |
          vPassword="Ci-$(openssl rand -hex 16)"
          echo "::add-mask::$vPassword"
          docker run -d --name sql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$vPassword" \
            mcr.microsoft.com/mssql/server:2017-latest
          for i in $(seq 1 60); do
            if docker exec sql /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$vPassword" -Q "SELECT 1" > /dev/null 2>&1; then
              echo "REPAS_TESTS_CONNEXION=Server=localhost,1433;User Id=sa;Password=$vPassword;TrustServerCertificate=True" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs sql
          exit 1

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mealprepcalendar
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

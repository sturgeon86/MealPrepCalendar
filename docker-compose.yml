# Développement local : SQL Server 2017 + l'application.
# Copier .env.example vers .env et choisir un mot de passe avant le premier `docker compose up`.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2017-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Définir MSSQL_SA_PASSWORD dans le fichier .env}"
    ports:
      - "14330:1433"   # 14330 côté hôte pour ne pas entrer en conflit avec un SQL Server local
    volumes:
      - sql-donnees:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build: .
    environment:
      # Development : autorise les cookies en HTTP (http://localhost), ce que la production refuse.
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Repas: "Server=sql;Database=Repas;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      TZ: "America/Toronto"
    ports:
      - "5180:8080"
    volumes:
      - cles:/data/keys
      - photos:/data/photos
    depends_on:
      sql:
        condition: service_healthy

volumes:
  sql-donnees:
  cles:
  photos:
